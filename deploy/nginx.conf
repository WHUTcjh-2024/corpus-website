limit_req_zone $binary_remote_addr zone=general_per_ip:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=research_per_ip:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;

server {
    listen 80;
    server_name _;
    client_max_body_size 32m;
    limit_conn connections_per_ip 20;
    limit_req_status 429;

    location /static/ {
        alias /srv/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location ~ ^/(search|parallel|statistics|exports)/ {
        limit_req zone=research_per_ip burst=20 nodelay;
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
    }

    location / {
        limit_req zone=general_per_ip burst=60 nodelay;
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
    }
}
