groups:
  - name: corpus-platform-outbox
    rules:
      - alert: CorpusOutboxDeadLettered
        expr: corpus_outbox_events{status="dead_letter"} > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Dead-letter outbox events require investigation.
      - alert: CorpusOutboxPublishDelay
        expr: corpus_outbox_oldest_pending_age_seconds > 300
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: The oldest pending outbox event is delayed by more than five minutes.
      - alert: CorpusOutboxBacklogGrowing
        expr: deriv(corpus_outbox_events{status="pending"}[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: The pending outbox backlog is growing.
      - alert: CorpusAgentRunFailed
        expr: corpus_agent_runs{status="failed"} > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: One or more corpus Agent runs failed and require inspection.
      - alert: CorpusAgentApprovalBacklog
        expr: corpus_agent_runs{status="waiting_approval"} > 20
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Corpus Agent approval backlog exceeds the expected operating threshold.
      - alert: CorpusRemoteAuditorBacklog
        expr: corpus_parallel_audits{status="running"} > 20
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Remote corpus auditor backlog exceeds the expected operating threshold.
      - alert: CorpusAgentExternalWaitDelayed
        expr: corpus_agent_external_wait_oldest_age_seconds > 300
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: An Agent has been waiting on an external audit result for more than five minutes.
      - alert: CorpusParallelAuditStalled
        expr: corpus_parallel_audit_oldest_active_age_seconds > 600
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: A parallel audit has remained pending or running for more than ten minutes.
      - alert: CorpusRagIndexFailed
        expr: corpus_rag_indexes{status="failed"} > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: One or more RAG index builds failed and require inspection.
      - alert: CorpusRagIndexStalled
        expr: corpus_rag_index_oldest_active_age_seconds > 900
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: A RAG index has remained pending or running for more than fifteen minutes.
