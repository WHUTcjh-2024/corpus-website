limit_req_zone $binary_remote_addr zone=general_per_ip:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=research_per_ip:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=login_per_ip:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;

upstream corpus_web {
    server web:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/corpus-platform/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/corpus-platform/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 32m;
    client_body_timeout 30s;
    keepalive_timeout 30s;
    limit_conn connections_per_ip 20;
    limit_req_status 429;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location /static/ {
        alias /srv/static/;
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /metrics {
        return 404;
    }

    location = /readyz {
        return 404;
    }

    location ~ ^/(api/auth/login|admin/login)/$ {
        limit_req zone=login_per_ip burst=10 nodelay;
        proxy_pass http://corpus_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location ~ ^/(search|parallel|statistics|exports)/ {
        limit_req zone=research_per_ip burst=20 nodelay;
        proxy_pass http://corpus_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
    }

    location / {
        limit_req zone=general_per_ip burst=60 nodelay;
        proxy_pass http://corpus_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
    }

    location ~ /\. {
        deny all;
    }
}
