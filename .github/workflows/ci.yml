name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: corpus_platform
          POSTGRES_USER: corpus_platform
          POSTGRES_PASSWORD: corpus_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U corpus_platform -d corpus_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ci-only-secret-key
      DATABASE_URL: postgres://corpus_platform:corpus_platform@127.0.0.1:5432/corpus_platform
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
      REQUIRE_REDIS_INTEGRATION: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate Django configuration
        run: python manage.py check
      - name: Validate production security configuration
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_SECRET_KEY: ci-production-secret-9f4a8c2d7e1b6g3h5j0k4m8n2p6r
          DJANGO_ALLOWED_HOSTS: ci.example.test
          DJANGO_CSRF_TRUSTED_ORIGINS: https://ci.example.test
          UPLOAD_SCANNER_BACKEND: apps.corpora.scanners.ClamAVUploadScanner
          METRICS_BEARER_TOKEN: ci-metrics-token-9f4a8c2d7e1b6g3h5j0k4m8n
        run: python manage.py check --deploy --fail-level WARNING
      - name: Check migration drift
        run: python manage.py makemigrations --check --dry-run
      - name: Compile Python modules
        run: python -m compileall -q apps config
      - name: Lint Python
        run: python -m ruff check .
      - name: Evaluate corpus Agent safety and grounding contracts
        run: python manage.py evaluate_corpus_agent --min-pass-rate 1.0
      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt
      - name: Run tests with coverage
        run: python -m coverage run manage.py test -v 2
      - name: Enforce coverage threshold
        run: python -m coverage report

  frontend:
    name: Frontend quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Run tests with coverage
        run: npm run test:coverage
      - name: Build production assets
        run: npm run build

  deployment:
    name: Deployment configuration gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate local Compose configuration
        run: docker compose --env-file .env.local.example -f docker-compose.local.yml config --quiet
      - name: Validate production Compose configuration
        run: docker compose --env-file .env.prod.example -f docker-compose.prod.yml config --quiet
