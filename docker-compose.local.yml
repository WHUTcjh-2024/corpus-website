name: corpus-platform-local

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-corpus_platform}
      POSTGRES_USER: ${POSTGRES_USER:-corpus_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-corpus_platform}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-corpus_platform} -d ${POSTGRES_DB:-corpus_platform}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  milvus:
    image: milvusdb/milvus:v2.5.5
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
    security_opt:
      - seccomp:unconfined
    volumes:
      - milvus_data:/var/lib/milvus
      - ./deploy/milvus/embedEtcd.yaml:/milvus/configs/embedEtcd.yaml:ro
      - ./deploy/milvus/user.yaml:/milvus/configs/user.yaml:ro
    ports:
      - "19530:19530"
      - "9091:9091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20

  corpus-auditor:
    build:
      context: ./backend/go/corpus-auditor
    command:
      - --listen=:8090
      - --grpc-listen=:9090
      - --data-root=/data
      - --state-dir=/var/lib/corpus-auditor/jobs
      - --control-token=${CORPUS_AUDITOR_COMPAT_API_TOKEN:-local-auditor-compat-token}
      - --redis-url=redis://redis:6379/0
      - --workers=${AUDITOR_WORKERS:-2}
      - --queue-capacity=${AUDITOR_QUEUE_CAPACITY:-100}
      - --audit-timeout=${AUDITOR_AUDIT_TIMEOUT:-10m}
    environment:
      AUDITOR_LISTEN_ADDR: :8090
      AUDITOR_COMMAND_STREAM: ${CORPUS_AUDITOR_COMMAND_STREAM:-corpus:audit:commands:v1}
      AUDITOR_COMMAND_GROUP: ${CORPUS_AUDITOR_COMMAND_GROUP:-corpus-auditor-v1}
      AUDITOR_RESULT_STREAM: ${CORPUS_AUDITOR_RESULT_STREAM:-corpus:audit:results:v1}
    volumes:
      - ./data:/data
      - auditor_state:/var/lib/corpus-auditor
    expose:
      - "8090"
      - "9090"
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: ./backend
    command: sh -c "python manage.py migrate --noinput && python manage.py ensure_test_account && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-dev-only-change-me}
      DJANGO_DEBUG: "true"
      FIXED_TEST_ACCOUNT_ENABLED: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,testserver
      DATABASE_URL: postgres://corpus_platform:corpus_platform@db:5432/corpus_platform
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-local-metrics-token}
      CELERY_VISIBILITY_TIMEOUT_SECONDS: ${CELERY_VISIBILITY_TIMEOUT_SECONDS:-3600}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-12}
      OUTBOX_LEASE_SECONDS: ${OUTBOX_LEASE_SECONDS:-30}
      OUTBOX_RETRY_INITIAL_SECONDS: ${OUTBOX_RETRY_INITIAL_SECONDS:-5}
      OUTBOX_RETRY_MAX_SECONDS: ${OUTBOX_RETRY_MAX_SECONDS:-300}
      OUTBOX_PUBLISHED_RETENTION_DAYS: ${OUTBOX_PUBLISHED_RETENTION_DAYS:-7}
      DATA_ROOT: /app/data
      USER_UPLOAD_MAX_FILE_BYTES: ${USER_UPLOAD_MAX_FILE_BYTES:-31457280}
      USER_UPLOAD_TOTAL_BYTES: ${USER_UPLOAD_TOTAL_BYTES:-31457280}
      TEST_UPLOAD_MAX_FILE_BYTES: ${TEST_UPLOAD_MAX_FILE_BYTES:-2097152}
      TEST_UPLOAD_TOTAL_BYTES: ${TEST_UPLOAD_TOTAL_BYTES:-5242880}
      UPLOAD_SCANNER_BACKEND: ${UPLOAD_SCANNER_BACKEND:-apps.corpora.scanners.DisabledUploadScanner}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT_SECONDS: ${CLAMAV_TIMEOUT_SECONDS:-15}
      EXPORT_TTL_SECONDS: ${EXPORT_TTL_SECONDS:-86400}
      EXPORT_MAX_ROWS: ${EXPORT_MAX_ROWS:-100000}
      EXPORT_MAX_DOWNLOADS: ${EXPORT_MAX_DOWNLOADS:-5}
      EXPORT_MAX_JOBS_PER_HOUR: ${EXPORT_MAX_JOBS_PER_HOUR:-10}
      AGENT_RUN_LEASE_SECONDS: ${AGENT_RUN_LEASE_SECONDS:-300}
      AGENT_APPROVAL_TTL_SECONDS: ${AGENT_APPROVAL_TTL_SECONDS:-600}
      AGENT_APPROVAL_CLEANUP_BATCH_SIZE: ${AGENT_APPROVAL_CLEANUP_BATCH_SIZE:-100}
      AGENT_EXTERNAL_WAIT_TTL_SECONDS: ${AGENT_EXTERNAL_WAIT_TTL_SECONDS:-3600}
      AGENT_EXTERNAL_WAIT_CLEANUP_BATCH_SIZE: ${AGENT_EXTERNAL_WAIT_CLEANUP_BATCH_SIZE:-100}
      AGENT_MAX_RUNS_PER_HOUR: ${AGENT_MAX_RUNS_PER_HOUR:-30}
      AGENT_MODEL_ENABLED: ${AGENT_MODEL_ENABLED:-false}
      AGENT_MODEL_BASE_URL: ${AGENT_MODEL_BASE_URL:-}
      AGENT_MODEL_API_KEY: ${AGENT_MODEL_API_KEY:-}
      AGENT_MODEL_NAME: ${AGENT_MODEL_NAME:-}
      AGENT_MODEL_TIMEOUT_SECONDS: ${AGENT_MODEL_TIMEOUT_SECONDS:-20}
      AGENT_MODEL_MAX_OUTPUT_TOKENS: ${AGENT_MODEL_MAX_OUTPUT_TOKENS:-600}
      AGENT_MODEL_INPUT_USD_PER_1M: ${AGENT_MODEL_INPUT_USD_PER_1M:-0}
      AGENT_MODEL_OUTPUT_USD_PER_1M: ${AGENT_MODEL_OUTPUT_USD_PER_1M:-0}
      RAG_INDEXING_ENABLED: ${RAG_INDEXING_ENABLED:-false}
      RAG_EMBEDDING_BASE_URL: ${RAG_EMBEDDING_BASE_URL:-}
      RAG_EMBEDDING_API_KEY: ${RAG_EMBEDDING_API_KEY:-}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-}
      RAG_EMBEDDING_TIMEOUT_SECONDS: ${RAG_EMBEDDING_TIMEOUT_SECONDS:-30}
      RAG_EMBEDDING_BATCH_SIZE: ${RAG_EMBEDDING_BATCH_SIZE:-32}
      RAG_EMBEDDING_MAX_DIMENSION: ${RAG_EMBEDDING_MAX_DIMENSION:-4096}
      RAG_MILVUS_URI: ${RAG_MILVUS_URI:-http://milvus:19530}
      RAG_MILVUS_TOKEN: ${RAG_MILVUS_TOKEN:-}
      RAG_MILVUS_DATABASE: ${RAG_MILVUS_DATABASE:-default}
      RAG_MILVUS_TIMEOUT_SECONDS: ${RAG_MILVUS_TIMEOUT_SECONDS:-10}
      RAG_MILVUS_COLLECTION_PREFIX: ${RAG_MILVUS_COLLECTION_PREFIX:-rag_}
      RAG_MILVUS_HNSW_M: ${RAG_MILVUS_HNSW_M:-16}
      RAG_MILVUS_HNSW_EF_CONSTRUCTION: ${RAG_MILVUS_HNSW_EF_CONSTRUCTION:-200}
      RAG_MILVUS_HNSW_EF_SEARCH: ${RAG_MILVUS_HNSW_EF_SEARCH:-64}
      RAG_MILVUS_CANDIDATE_MULTIPLIER: ${RAG_MILVUS_CANDIDATE_MULTIPLIER:-10}
      RAG_CHUNK_MAX_CHARACTERS: ${RAG_CHUNK_MAX_CHARACTERS:-1800}
      RAG_MAX_CHUNKS: ${RAG_MAX_CHUNKS:-200000}
      RAG_INDEX_LEASE_SECONDS: ${RAG_INDEX_LEASE_SECONDS:-900}
      CORPUS_AUDITOR_QUEUE_ENABLED: "true"
      CORPUS_AUDITOR_QUEUE_URL: redis://redis:6379/0
      CORPUS_AUDITOR_COMMAND_STREAM: ${CORPUS_AUDITOR_COMMAND_STREAM:-corpus:audit:commands:v1}
      CORPUS_AUDITOR_COMMAND_GROUP: ${CORPUS_AUDITOR_COMMAND_GROUP:-corpus-auditor-v1}
      CORPUS_AUDITOR_RESULT_STREAM: ${CORPUS_AUDITOR_RESULT_STREAM:-corpus:audit:results:v1}
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
    ports:
      - "8010:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=3).read()\""]
      interval: 10s
      timeout: 5s
      retries: 12

  processing-worker:
    build:
      context: ./backend
    command: celery -A config worker --loglevel=info --queues=processing,default,agent,rag,audit_commands --hostname=processing@%h --concurrency=${PROCESSING_WORKER_CONCURRENCY:-2}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-dev-only-change-me}
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,testserver
      DATABASE_URL: postgres://corpus_platform:corpus_platform@db:5432/corpus_platform
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DATA_ROOT: /app/data
      USER_UPLOAD_MAX_FILE_BYTES: ${USER_UPLOAD_MAX_FILE_BYTES:-31457280}
      USER_UPLOAD_TOTAL_BYTES: ${USER_UPLOAD_TOTAL_BYTES:-31457280}
      TEST_UPLOAD_MAX_FILE_BYTES: ${TEST_UPLOAD_MAX_FILE_BYTES:-2097152}
      TEST_UPLOAD_TOTAL_BYTES: ${TEST_UPLOAD_TOTAL_BYTES:-5242880}
      UPLOAD_SCANNER_BACKEND: ${UPLOAD_SCANNER_BACKEND:-apps.corpora.scanners.DisabledUploadScanner}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT_SECONDS: ${CLAMAV_TIMEOUT_SECONDS:-15}
      EXPORT_TTL_SECONDS: ${EXPORT_TTL_SECONDS:-86400}
      EXPORT_MAX_ROWS: ${EXPORT_MAX_ROWS:-100000}
      EXPORT_MAX_DOWNLOADS: ${EXPORT_MAX_DOWNLOADS:-5}
      EXPORT_MAX_JOBS_PER_HOUR: ${EXPORT_MAX_JOBS_PER_HOUR:-10}
      AGENT_RUN_LEASE_SECONDS: ${AGENT_RUN_LEASE_SECONDS:-300}
      AGENT_APPROVAL_TTL_SECONDS: ${AGENT_APPROVAL_TTL_SECONDS:-600}
      AGENT_APPROVAL_CLEANUP_BATCH_SIZE: ${AGENT_APPROVAL_CLEANUP_BATCH_SIZE:-100}
      AGENT_EXTERNAL_WAIT_TTL_SECONDS: ${AGENT_EXTERNAL_WAIT_TTL_SECONDS:-3600}
      AGENT_EXTERNAL_WAIT_CLEANUP_BATCH_SIZE: ${AGENT_EXTERNAL_WAIT_CLEANUP_BATCH_SIZE:-100}
      AGENT_MAX_RUNS_PER_HOUR: ${AGENT_MAX_RUNS_PER_HOUR:-30}
      AGENT_MODEL_ENABLED: ${AGENT_MODEL_ENABLED:-false}
      AGENT_MODEL_BASE_URL: ${AGENT_MODEL_BASE_URL:-}
      AGENT_MODEL_API_KEY: ${AGENT_MODEL_API_KEY:-}
      AGENT_MODEL_NAME: ${AGENT_MODEL_NAME:-}
      AGENT_MODEL_TIMEOUT_SECONDS: ${AGENT_MODEL_TIMEOUT_SECONDS:-20}
      AGENT_MODEL_MAX_OUTPUT_TOKENS: ${AGENT_MODEL_MAX_OUTPUT_TOKENS:-600}
      AGENT_MODEL_INPUT_USD_PER_1M: ${AGENT_MODEL_INPUT_USD_PER_1M:-0}
      AGENT_MODEL_OUTPUT_USD_PER_1M: ${AGENT_MODEL_OUTPUT_USD_PER_1M:-0}
      RAG_INDEXING_ENABLED: ${RAG_INDEXING_ENABLED:-false}
      RAG_EMBEDDING_BASE_URL: ${RAG_EMBEDDING_BASE_URL:-}
      RAG_EMBEDDING_API_KEY: ${RAG_EMBEDDING_API_KEY:-}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-}
      RAG_EMBEDDING_TIMEOUT_SECONDS: ${RAG_EMBEDDING_TIMEOUT_SECONDS:-30}
      RAG_EMBEDDING_BATCH_SIZE: ${RAG_EMBEDDING_BATCH_SIZE:-32}
      RAG_EMBEDDING_MAX_DIMENSION: ${RAG_EMBEDDING_MAX_DIMENSION:-4096}
      RAG_MILVUS_URI: ${RAG_MILVUS_URI:-http://milvus:19530}
      RAG_MILVUS_TOKEN: ${RAG_MILVUS_TOKEN:-}
      RAG_MILVUS_DATABASE: ${RAG_MILVUS_DATABASE:-default}
      RAG_MILVUS_TIMEOUT_SECONDS: ${RAG_MILVUS_TIMEOUT_SECONDS:-10}
      RAG_MILVUS_COLLECTION_PREFIX: ${RAG_MILVUS_COLLECTION_PREFIX:-rag_}
      RAG_MILVUS_HNSW_M: ${RAG_MILVUS_HNSW_M:-16}
      RAG_MILVUS_HNSW_EF_CONSTRUCTION: ${RAG_MILVUS_HNSW_EF_CONSTRUCTION:-200}
      RAG_MILVUS_HNSW_EF_SEARCH: ${RAG_MILVUS_HNSW_EF_SEARCH:-64}
      RAG_MILVUS_CANDIDATE_MULTIPLIER: ${RAG_MILVUS_CANDIDATE_MULTIPLIER:-10}
      RAG_CHUNK_MAX_CHARACTERS: ${RAG_CHUNK_MAX_CHARACTERS:-1800}
      RAG_MAX_CHUNKS: ${RAG_MAX_CHUNKS:-200000}
      RAG_INDEX_LEASE_SECONDS: ${RAG_INDEX_LEASE_SECONDS:-900}
      CORPUS_AUDITOR_QUEUE_ENABLED: "true"
      CORPUS_AUDITOR_QUEUE_URL: redis://redis:6379/0
      CORPUS_AUDITOR_COMMAND_STREAM: ${CORPUS_AUDITOR_COMMAND_STREAM:-corpus:audit:commands:v1}
      CORPUS_AUDITOR_COMMAND_GROUP: ${CORPUS_AUDITOR_COMMAND_GROUP:-corpus-auditor-v1}
      CORPUS_AUDITOR_RESULT_STREAM: ${CORPUS_AUDITOR_RESULT_STREAM:-corpus:audit:results:v1}
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
    depends_on:
      web:
        condition: service_healthy

  export-worker:
    build:
      context: ./backend
    command: celery -A config worker --loglevel=info --queues=exports --hostname=exports@%h --concurrency=${EXPORT_WORKER_CONCURRENCY:-1}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-dev-only-change-me}
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,testserver
      DATABASE_URL: postgres://corpus_platform:corpus_platform@db:5432/corpus_platform
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DATA_ROOT: /app/data
      USER_UPLOAD_MAX_FILE_BYTES: ${USER_UPLOAD_MAX_FILE_BYTES:-31457280}
      USER_UPLOAD_TOTAL_BYTES: ${USER_UPLOAD_TOTAL_BYTES:-31457280}
      TEST_UPLOAD_MAX_FILE_BYTES: ${TEST_UPLOAD_MAX_FILE_BYTES:-2097152}
      TEST_UPLOAD_TOTAL_BYTES: ${TEST_UPLOAD_TOTAL_BYTES:-5242880}
      UPLOAD_SCANNER_BACKEND: ${UPLOAD_SCANNER_BACKEND:-apps.corpora.scanners.DisabledUploadScanner}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT_SECONDS: ${CLAMAV_TIMEOUT_SECONDS:-15}
      EXPORT_TTL_SECONDS: ${EXPORT_TTL_SECONDS:-86400}
      EXPORT_MAX_ROWS: ${EXPORT_MAX_ROWS:-100000}
      EXPORT_MAX_DOWNLOADS: ${EXPORT_MAX_DOWNLOADS:-5}
      EXPORT_MAX_JOBS_PER_HOUR: ${EXPORT_MAX_JOBS_PER_HOUR:-10}
      AGENT_RUN_LEASE_SECONDS: ${AGENT_RUN_LEASE_SECONDS:-300}
      AGENT_APPROVAL_TTL_SECONDS: ${AGENT_APPROVAL_TTL_SECONDS:-600}
      AGENT_APPROVAL_CLEANUP_BATCH_SIZE: ${AGENT_APPROVAL_CLEANUP_BATCH_SIZE:-100}
      AGENT_EXTERNAL_WAIT_TTL_SECONDS: ${AGENT_EXTERNAL_WAIT_TTL_SECONDS:-3600}
      AGENT_EXTERNAL_WAIT_CLEANUP_BATCH_SIZE: ${AGENT_EXTERNAL_WAIT_CLEANUP_BATCH_SIZE:-100}
      AGENT_MAX_RUNS_PER_HOUR: ${AGENT_MAX_RUNS_PER_HOUR:-30}
      AGENT_MODEL_ENABLED: ${AGENT_MODEL_ENABLED:-false}
      AGENT_MODEL_BASE_URL: ${AGENT_MODEL_BASE_URL:-}
      AGENT_MODEL_API_KEY: ${AGENT_MODEL_API_KEY:-}
      AGENT_MODEL_NAME: ${AGENT_MODEL_NAME:-}
      AGENT_MODEL_TIMEOUT_SECONDS: ${AGENT_MODEL_TIMEOUT_SECONDS:-20}
      AGENT_MODEL_MAX_OUTPUT_TOKENS: ${AGENT_MODEL_MAX_OUTPUT_TOKENS:-600}
      AGENT_MODEL_INPUT_USD_PER_1M: ${AGENT_MODEL_INPUT_USD_PER_1M:-0}
      AGENT_MODEL_OUTPUT_USD_PER_1M: ${AGENT_MODEL_OUTPUT_USD_PER_1M:-0}
      CORPUS_AUDITOR_QUEUE_ENABLED: "true"
      CORPUS_AUDITOR_QUEUE_URL: redis://redis:6379/0
      CORPUS_AUDITOR_COMMAND_STREAM: ${CORPUS_AUDITOR_COMMAND_STREAM:-corpus:audit:commands:v1}
      CORPUS_AUDITOR_COMMAND_GROUP: ${CORPUS_AUDITOR_COMMAND_GROUP:-corpus-auditor-v1}
      CORPUS_AUDITOR_RESULT_STREAM: ${CORPUS_AUDITOR_RESULT_STREAM:-corpus:audit:results:v1}
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
    depends_on:
      web:
        condition: service_healthy

  audit-result-projector:
    build:
      context: ./backend
    command: python manage.py project_audit_results --loop --interval ${AUDIT_RESULT_PROJECT_INTERVAL_SECONDS:-1}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-dev-only-change-me}
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,testserver
      DATABASE_URL: postgres://corpus_platform:corpus_platform@db:5432/corpus_platform
      REDIS_URL: redis://redis:6379/0
      CORPUS_AUDITOR_QUEUE_ENABLED: "true"
      CORPUS_AUDITOR_QUEUE_URL: redis://redis:6379/0
      CORPUS_AUDITOR_COMMAND_STREAM: ${CORPUS_AUDITOR_COMMAND_STREAM:-corpus:audit:commands:v1}
      CORPUS_AUDITOR_COMMAND_GROUP: ${CORPUS_AUDITOR_COMMAND_GROUP:-corpus-auditor-v1}
      CORPUS_AUDITOR_RESULT_STREAM: ${CORPUS_AUDITOR_RESULT_STREAM:-corpus:audit:results:v1}
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy

  outbox:
    build:
      context: ./backend
    command: python manage.py publish_outbox --loop --interval ${OUTBOX_PUBLISH_INTERVAL_SECONDS:-5} --cleanup-interval ${OUTBOX_CLEANUP_INTERVAL_SECONDS:-3600}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-dev-only-change-me}
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,testserver
      DATABASE_URL: postgres://corpus_platform:corpus_platform@db:5432/corpus_platform
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-12}
      CELERY_VISIBILITY_TIMEOUT_SECONDS: ${CELERY_VISIBILITY_TIMEOUT_SECONDS:-3600}
      OUTBOX_LEASE_SECONDS: ${OUTBOX_LEASE_SECONDS:-30}
      OUTBOX_RETRY_INITIAL_SECONDS: ${OUTBOX_RETRY_INITIAL_SECONDS:-5}
      OUTBOX_RETRY_MAX_SECONDS: ${OUTBOX_RETRY_MAX_SECONDS:-300}
      OUTBOX_PUBLISHED_RETENTION_DAYS: ${OUTBOX_PUBLISHED_RETENTION_DAYS:-7}
      AGENT_APPROVAL_CLEANUP_BATCH_SIZE: ${AGENT_APPROVAL_CLEANUP_BATCH_SIZE:-100}
      AGENT_EXTERNAL_WAIT_TTL_SECONDS: ${AGENT_EXTERNAL_WAIT_TTL_SECONDS:-3600}
      AGENT_EXTERNAL_WAIT_CLEANUP_BATCH_SIZE: ${AGENT_EXTERNAL_WAIT_CLEANUP_BATCH_SIZE:-100}
      CORPUS_AUDITOR_QUEUE_ENABLED: "true"
      CORPUS_AUDITOR_QUEUE_URL: redis://redis:6379/0
      CORPUS_AUDITOR_COMMAND_STREAM: ${CORPUS_AUDITOR_COMMAND_STREAM:-corpus:audit:commands:v1}
      CORPUS_AUDITOR_COMMAND_GROUP: ${CORPUS_AUDITOR_COMMAND_GROUP:-corpus-auditor-v1}
      CORPUS_AUDITOR_RESULT_STREAM: ${CORPUS_AUDITOR_RESULT_STREAM:-corpus:audit:results:v1}
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  milvus_data:
  auditor_state:
