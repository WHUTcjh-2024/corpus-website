name: corpus-platform-local

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-corpus_platform}
      POSTGRES_USER: ${POSTGRES_USER:-corpus_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-corpus_platform}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-corpus_platform} -d ${POSTGRES_DB:-corpus_platform}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ./backend
    command: sh -c "python manage.py migrate --noinput && python manage.py ensure_test_account && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-dev-only-change-me}
      DJANGO_DEBUG: "true"
      FIXED_TEST_ACCOUNT_ENABLED: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,testserver
      DATABASE_URL: postgres://corpus_platform:corpus_platform@db:5432/corpus_platform
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-local-metrics-token}
      CELERY_VISIBILITY_TIMEOUT_SECONDS: ${CELERY_VISIBILITY_TIMEOUT_SECONDS:-3600}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-12}
      OUTBOX_LEASE_SECONDS: ${OUTBOX_LEASE_SECONDS:-30}
      OUTBOX_RETRY_INITIAL_SECONDS: ${OUTBOX_RETRY_INITIAL_SECONDS:-5}
      OUTBOX_RETRY_MAX_SECONDS: ${OUTBOX_RETRY_MAX_SECONDS:-300}
      OUTBOX_PUBLISHED_RETENTION_DAYS: ${OUTBOX_PUBLISHED_RETENTION_DAYS:-7}
      DATA_ROOT: /app/data
      USER_UPLOAD_MAX_FILE_BYTES: ${USER_UPLOAD_MAX_FILE_BYTES:-31457280}
      USER_UPLOAD_TOTAL_BYTES: ${USER_UPLOAD_TOTAL_BYTES:-31457280}
      TEST_UPLOAD_MAX_FILE_BYTES: ${TEST_UPLOAD_MAX_FILE_BYTES:-2097152}
      TEST_UPLOAD_TOTAL_BYTES: ${TEST_UPLOAD_TOTAL_BYTES:-5242880}
      UPLOAD_SCANNER_BACKEND: ${UPLOAD_SCANNER_BACKEND:-apps.corpora.scanners.DisabledUploadScanner}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT_SECONDS: ${CLAMAV_TIMEOUT_SECONDS:-15}
      EXPORT_TTL_SECONDS: ${EXPORT_TTL_SECONDS:-86400}
      EXPORT_MAX_ROWS: ${EXPORT_MAX_ROWS:-100000}
      EXPORT_MAX_DOWNLOADS: ${EXPORT_MAX_DOWNLOADS:-5}
      EXPORT_MAX_JOBS_PER_HOUR: ${EXPORT_MAX_JOBS_PER_HOUR:-10}
      CORPUS_AUDITOR_COMMAND: corpus-auditor
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
    ports:
      - "8010:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).read()\""]
      interval: 10s
      timeout: 5s
      retries: 12

  processing-worker:
    build:
      context: ./backend
    command: celery -A config worker --loglevel=info --queues=processing,default --hostname=processing@%h --concurrency=${PROCESSING_WORKER_CONCURRENCY:-2}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-dev-only-change-me}
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,testserver
      DATABASE_URL: postgres://corpus_platform:corpus_platform@db:5432/corpus_platform
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DATA_ROOT: /app/data
      USER_UPLOAD_MAX_FILE_BYTES: ${USER_UPLOAD_MAX_FILE_BYTES:-31457280}
      USER_UPLOAD_TOTAL_BYTES: ${USER_UPLOAD_TOTAL_BYTES:-31457280}
      TEST_UPLOAD_MAX_FILE_BYTES: ${TEST_UPLOAD_MAX_FILE_BYTES:-2097152}
      TEST_UPLOAD_TOTAL_BYTES: ${TEST_UPLOAD_TOTAL_BYTES:-5242880}
      UPLOAD_SCANNER_BACKEND: ${UPLOAD_SCANNER_BACKEND:-apps.corpora.scanners.DisabledUploadScanner}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT_SECONDS: ${CLAMAV_TIMEOUT_SECONDS:-15}
      EXPORT_TTL_SECONDS: ${EXPORT_TTL_SECONDS:-86400}
      EXPORT_MAX_ROWS: ${EXPORT_MAX_ROWS:-100000}
      EXPORT_MAX_DOWNLOADS: ${EXPORT_MAX_DOWNLOADS:-5}
      EXPORT_MAX_JOBS_PER_HOUR: ${EXPORT_MAX_JOBS_PER_HOUR:-10}
      CORPUS_AUDITOR_COMMAND: corpus-auditor
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
    depends_on:
      web:
        condition: service_healthy

  export-worker:
    build:
      context: ./backend
    command: celery -A config worker --loglevel=info --queues=exports --hostname=exports@%h --concurrency=${EXPORT_WORKER_CONCURRENCY:-1}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-dev-only-change-me}
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,testserver
      DATABASE_URL: postgres://corpus_platform:corpus_platform@db:5432/corpus_platform
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DATA_ROOT: /app/data
      USER_UPLOAD_MAX_FILE_BYTES: ${USER_UPLOAD_MAX_FILE_BYTES:-31457280}
      USER_UPLOAD_TOTAL_BYTES: ${USER_UPLOAD_TOTAL_BYTES:-31457280}
      TEST_UPLOAD_MAX_FILE_BYTES: ${TEST_UPLOAD_MAX_FILE_BYTES:-2097152}
      TEST_UPLOAD_TOTAL_BYTES: ${TEST_UPLOAD_TOTAL_BYTES:-5242880}
      UPLOAD_SCANNER_BACKEND: ${UPLOAD_SCANNER_BACKEND:-apps.corpora.scanners.DisabledUploadScanner}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT_SECONDS: ${CLAMAV_TIMEOUT_SECONDS:-15}
      EXPORT_TTL_SECONDS: ${EXPORT_TTL_SECONDS:-86400}
      EXPORT_MAX_ROWS: ${EXPORT_MAX_ROWS:-100000}
      EXPORT_MAX_DOWNLOADS: ${EXPORT_MAX_DOWNLOADS:-5}
      EXPORT_MAX_JOBS_PER_HOUR: ${EXPORT_MAX_JOBS_PER_HOUR:-10}
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
    depends_on:
      web:
        condition: service_healthy

  outbox:
    build:
      context: ./backend
    command: python manage.py publish_outbox --loop --interval ${OUTBOX_PUBLISH_INTERVAL_SECONDS:-5} --cleanup-interval ${OUTBOX_CLEANUP_INTERVAL_SECONDS:-3600}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-dev-only-change-me}
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,testserver
      DATABASE_URL: postgres://corpus_platform:corpus_platform@db:5432/corpus_platform
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-12}
      CELERY_VISIBILITY_TIMEOUT_SECONDS: ${CELERY_VISIBILITY_TIMEOUT_SECONDS:-3600}
      OUTBOX_LEASE_SECONDS: ${OUTBOX_LEASE_SECONDS:-30}
      OUTBOX_RETRY_INITIAL_SECONDS: ${OUTBOX_RETRY_INITIAL_SECONDS:-5}
      OUTBOX_RETRY_MAX_SECONDS: ${OUTBOX_RETRY_MAX_SECONDS:-300}
      OUTBOX_PUBLISHED_RETENTION_DAYS: ${OUTBOX_PUBLISHED_RETENTION_DAYS:-7}
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
