name: corpus-platform-prod

services:
  corpus-auditor:
    build:
      context: ./backend/go/corpus-auditor
    command:
      - --listen=:8090
      - --grpc-listen=:9090
      - --data-root=/data
      - --state-dir=/var/lib/corpus-auditor/jobs
      - --control-token=${CORPUS_AUDITOR_COMPAT_API_TOKEN:?CORPUS_AUDITOR_COMPAT_API_TOKEN is required}
      - --redis-url=${CORPUS_AUDITOR_QUEUE_URL:?CORPUS_AUDITOR_QUEUE_URL is required}
      - --workers=${AUDITOR_WORKERS:-2}
      - --queue-capacity=${AUDITOR_QUEUE_CAPACITY:-100}
      - --audit-timeout=${AUDITOR_AUDIT_TIMEOUT:-10m}
    volumes:
      - ${DATA_ROOT_HOST_PATH:?DATA_ROOT_HOST_PATH is required}:/data
      - auditor_state:/var/lib/corpus-auditor
    environment:
      AUDITOR_COMMAND_STREAM: ${CORPUS_AUDITOR_COMMAND_STREAM:-corpus:audit:commands:v1}
      AUDITOR_COMMAND_GROUP: ${CORPUS_AUDITOR_COMMAND_GROUP:-corpus-auditor-v1}
      AUDITOR_RESULT_STREAM: ${CORPUS_AUDITOR_RESULT_STREAM:-corpus:audit:results:v1}
    expose:
      - "8090"
      - "9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/readyz"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  web:
    build:
      context: ./backend
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120 --access-logfile - --error-logfile -"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS is required}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?CELERY_BROKER_URL is required}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:?CELERY_RESULT_BACKEND is required}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:?METRICS_BEARER_TOKEN is required}
      CELERY_VISIBILITY_TIMEOUT_SECONDS: ${CELERY_VISIBILITY_TIMEOUT_SECONDS:-3600}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-12}
      OUTBOX_LEASE_SECONDS: ${OUTBOX_LEASE_SECONDS:-30}
      OUTBOX_RETRY_INITIAL_SECONDS: ${OUTBOX_RETRY_INITIAL_SECONDS:-5}
      OUTBOX_RETRY_MAX_SECONDS: ${OUTBOX_RETRY_MAX_SECONDS:-300}
      OUTBOX_PUBLISHED_RETENTION_DAYS: ${OUTBOX_PUBLISHED_RETENTION_DAYS:-7}
      DATA_ROOT: ${DATA_ROOT:-/app/data}
      USER_UPLOAD_MAX_FILE_BYTES: ${USER_UPLOAD_MAX_FILE_BYTES:-31457280}
      USER_UPLOAD_TOTAL_BYTES: ${USER_UPLOAD_TOTAL_BYTES:-31457280}
      TEST_UPLOAD_MAX_FILE_BYTES: ${TEST_UPLOAD_MAX_FILE_BYTES:-2097152}
      TEST_UPLOAD_TOTAL_BYTES: ${TEST_UPLOAD_TOTAL_BYTES:-5242880}
      UPLOAD_SCANNER_BACKEND: ${UPLOAD_SCANNER_BACKEND:?UPLOAD_SCANNER_BACKEND is required}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT_SECONDS: ${CLAMAV_TIMEOUT_SECONDS:-15}
      EXPORT_TTL_SECONDS: ${EXPORT_TTL_SECONDS:-86400}
      EXPORT_MAX_ROWS: ${EXPORT_MAX_ROWS:-100000}
      EXPORT_MAX_DOWNLOADS: ${EXPORT_MAX_DOWNLOADS:-5}
      EXPORT_MAX_JOBS_PER_HOUR: ${EXPORT_MAX_JOBS_PER_HOUR:-10}
      AGENT_RUN_LEASE_SECONDS: ${AGENT_RUN_LEASE_SECONDS:-300}
      AGENT_APPROVAL_TTL_SECONDS: ${AGENT_APPROVAL_TTL_SECONDS:-600}
      AGENT_APPROVAL_CLEANUP_BATCH_SIZE: ${AGENT_APPROVAL_CLEANUP_BATCH_SIZE:-100}
      AGENT_EXTERNAL_WAIT_TTL_SECONDS: ${AGENT_EXTERNAL_WAIT_TTL_SECONDS:-3600}
      AGENT_EXTERNAL_WAIT_CLEANUP_BATCH_SIZE: ${AGENT_EXTERNAL_WAIT_CLEANUP_BATCH_SIZE:-100}
      AGENT_MAX_RUNS_PER_HOUR: ${AGENT_MAX_RUNS_PER_HOUR:-30}
      AGENT_MODEL_ENABLED: ${AGENT_MODEL_ENABLED:-false}
      AGENT_MODEL_BASE_URL: ${AGENT_MODEL_BASE_URL:-}
      AGENT_MODEL_API_KEY: ${AGENT_MODEL_API_KEY:-}
      AGENT_MODEL_NAME: ${AGENT_MODEL_NAME:-}
      AGENT_MODEL_TIMEOUT_SECONDS: ${AGENT_MODEL_TIMEOUT_SECONDS:-20}
      AGENT_MODEL_MAX_OUTPUT_TOKENS: ${AGENT_MODEL_MAX_OUTPUT_TOKENS:-600}
      AGENT_MODEL_INPUT_USD_PER_1M: ${AGENT_MODEL_INPUT_USD_PER_1M:-0}
      AGENT_MODEL_OUTPUT_USD_PER_1M: ${AGENT_MODEL_OUTPUT_USD_PER_1M:-0}
      CORPUS_AUDITOR_QUEUE_ENABLED: "true"
      CORPUS_AUDITOR_QUEUE_URL: ${CORPUS_AUDITOR_QUEUE_URL:?CORPUS_AUDITOR_QUEUE_URL is required}
      CORPUS_AUDITOR_COMMAND_STREAM: ${CORPUS_AUDITOR_COMMAND_STREAM:-corpus:audit:commands:v1}
      CORPUS_AUDITOR_COMMAND_GROUP: ${CORPUS_AUDITOR_COMMAND_GROUP:-corpus-auditor-v1}
      CORPUS_AUDITOR_RESULT_STREAM: ${CORPUS_AUDITOR_RESULT_STREAM:-corpus:audit:results:v1}
    volumes:
      - ${DATA_ROOT_HOST_PATH:?DATA_ROOT_HOST_PATH is required}:/app/data
      - static_files:/app/backend/staticfiles
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=3).read()\""]
      interval: 15s
      timeout: 5s
      retries: 12

  processing-worker:
    build:
      context: ./backend
    command: celery -A config worker --loglevel=info --queues=processing,default,agent,audit_commands --hostname=processing@%h --concurrency=${PROCESSING_WORKER_CONCURRENCY:-2}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?CELERY_BROKER_URL is required}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:?CELERY_RESULT_BACKEND is required}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:?METRICS_BEARER_TOKEN is required}
      CELERY_VISIBILITY_TIMEOUT_SECONDS: ${CELERY_VISIBILITY_TIMEOUT_SECONDS:-3600}
      DATA_ROOT: ${DATA_ROOT:-/app/data}
      USER_UPLOAD_MAX_FILE_BYTES: ${USER_UPLOAD_MAX_FILE_BYTES:-31457280}
      USER_UPLOAD_TOTAL_BYTES: ${USER_UPLOAD_TOTAL_BYTES:-31457280}
      TEST_UPLOAD_MAX_FILE_BYTES: ${TEST_UPLOAD_MAX_FILE_BYTES:-2097152}
      TEST_UPLOAD_TOTAL_BYTES: ${TEST_UPLOAD_TOTAL_BYTES:-5242880}
      UPLOAD_SCANNER_BACKEND: ${UPLOAD_SCANNER_BACKEND:?UPLOAD_SCANNER_BACKEND is required}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT_SECONDS: ${CLAMAV_TIMEOUT_SECONDS:-15}
      EXPORT_TTL_SECONDS: ${EXPORT_TTL_SECONDS:-86400}
      EXPORT_MAX_ROWS: ${EXPORT_MAX_ROWS:-100000}
      EXPORT_MAX_DOWNLOADS: ${EXPORT_MAX_DOWNLOADS:-5}
      EXPORT_MAX_JOBS_PER_HOUR: ${EXPORT_MAX_JOBS_PER_HOUR:-10}
      AGENT_RUN_LEASE_SECONDS: ${AGENT_RUN_LEASE_SECONDS:-300}
      AGENT_APPROVAL_TTL_SECONDS: ${AGENT_APPROVAL_TTL_SECONDS:-600}
      AGENT_APPROVAL_CLEANUP_BATCH_SIZE: ${AGENT_APPROVAL_CLEANUP_BATCH_SIZE:-100}
      AGENT_EXTERNAL_WAIT_TTL_SECONDS: ${AGENT_EXTERNAL_WAIT_TTL_SECONDS:-3600}
      AGENT_EXTERNAL_WAIT_CLEANUP_BATCH_SIZE: ${AGENT_EXTERNAL_WAIT_CLEANUP_BATCH_SIZE:-100}
      AGENT_MAX_RUNS_PER_HOUR: ${AGENT_MAX_RUNS_PER_HOUR:-30}
      AGENT_MODEL_ENABLED: ${AGENT_MODEL_ENABLED:-false}
      AGENT_MODEL_BASE_URL: ${AGENT_MODEL_BASE_URL:-}
      AGENT_MODEL_API_KEY: ${AGENT_MODEL_API_KEY:-}
      AGENT_MODEL_NAME: ${AGENT_MODEL_NAME:-}
      AGENT_MODEL_TIMEOUT_SECONDS: ${AGENT_MODEL_TIMEOUT_SECONDS:-20}
      AGENT_MODEL_MAX_OUTPUT_TOKENS: ${AGENT_MODEL_MAX_OUTPUT_TOKENS:-600}
      AGENT_MODEL_INPUT_USD_PER_1M: ${AGENT_MODEL_INPUT_USD_PER_1M:-0}
      AGENT_MODEL_OUTPUT_USD_PER_1M: ${AGENT_MODEL_OUTPUT_USD_PER_1M:-0}
      CORPUS_AUDITOR_QUEUE_ENABLED: "true"
      CORPUS_AUDITOR_QUEUE_URL: ${CORPUS_AUDITOR_QUEUE_URL:?CORPUS_AUDITOR_QUEUE_URL is required}
      CORPUS_AUDITOR_COMMAND_STREAM: ${CORPUS_AUDITOR_COMMAND_STREAM:-corpus:audit:commands:v1}
      CORPUS_AUDITOR_COMMAND_GROUP: ${CORPUS_AUDITOR_COMMAND_GROUP:-corpus-auditor-v1}
      CORPUS_AUDITOR_RESULT_STREAM: ${CORPUS_AUDITOR_RESULT_STREAM:-corpus:audit:results:v1}
    volumes:
      - ${DATA_ROOT_HOST_PATH:?DATA_ROOT_HOST_PATH is required}:/app/data
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  export-worker:
    build:
      context: ./backend
    command: celery -A config worker --loglevel=info --queues=exports --hostname=exports@%h --concurrency=${EXPORT_WORKER_CONCURRENCY:-1}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?CELERY_BROKER_URL is required}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:?CELERY_RESULT_BACKEND is required}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:?METRICS_BEARER_TOKEN is required}
      CELERY_VISIBILITY_TIMEOUT_SECONDS: ${CELERY_VISIBILITY_TIMEOUT_SECONDS:-3600}
      DATA_ROOT: ${DATA_ROOT:-/app/data}
      USER_UPLOAD_MAX_FILE_BYTES: ${USER_UPLOAD_MAX_FILE_BYTES:-31457280}
      USER_UPLOAD_TOTAL_BYTES: ${USER_UPLOAD_TOTAL_BYTES:-31457280}
      TEST_UPLOAD_MAX_FILE_BYTES: ${TEST_UPLOAD_MAX_FILE_BYTES:-2097152}
      TEST_UPLOAD_TOTAL_BYTES: ${TEST_UPLOAD_TOTAL_BYTES:-5242880}
      UPLOAD_SCANNER_BACKEND: ${UPLOAD_SCANNER_BACKEND:?UPLOAD_SCANNER_BACKEND is required}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT_SECONDS: ${CLAMAV_TIMEOUT_SECONDS:-15}
      EXPORT_TTL_SECONDS: ${EXPORT_TTL_SECONDS:-86400}
      EXPORT_MAX_ROWS: ${EXPORT_MAX_ROWS:-100000}
      EXPORT_MAX_DOWNLOADS: ${EXPORT_MAX_DOWNLOADS:-5}
      EXPORT_MAX_JOBS_PER_HOUR: ${EXPORT_MAX_JOBS_PER_HOUR:-10}
      AGENT_RUN_LEASE_SECONDS: ${AGENT_RUN_LEASE_SECONDS:-300}
      AGENT_APPROVAL_TTL_SECONDS: ${AGENT_APPROVAL_TTL_SECONDS:-600}
      AGENT_APPROVAL_CLEANUP_BATCH_SIZE: ${AGENT_APPROVAL_CLEANUP_BATCH_SIZE:-100}
      AGENT_EXTERNAL_WAIT_TTL_SECONDS: ${AGENT_EXTERNAL_WAIT_TTL_SECONDS:-3600}
      AGENT_EXTERNAL_WAIT_CLEANUP_BATCH_SIZE: ${AGENT_EXTERNAL_WAIT_CLEANUP_BATCH_SIZE:-100}
      AGENT_MAX_RUNS_PER_HOUR: ${AGENT_MAX_RUNS_PER_HOUR:-30}
      AGENT_MODEL_ENABLED: ${AGENT_MODEL_ENABLED:-false}
      AGENT_MODEL_BASE_URL: ${AGENT_MODEL_BASE_URL:-}
      AGENT_MODEL_API_KEY: ${AGENT_MODEL_API_KEY:-}
      AGENT_MODEL_NAME: ${AGENT_MODEL_NAME:-}
      AGENT_MODEL_TIMEOUT_SECONDS: ${AGENT_MODEL_TIMEOUT_SECONDS:-20}
      AGENT_MODEL_MAX_OUTPUT_TOKENS: ${AGENT_MODEL_MAX_OUTPUT_TOKENS:-600}
      AGENT_MODEL_INPUT_USD_PER_1M: ${AGENT_MODEL_INPUT_USD_PER_1M:-0}
      AGENT_MODEL_OUTPUT_USD_PER_1M: ${AGENT_MODEL_OUTPUT_USD_PER_1M:-0}
      CORPUS_AUDITOR_QUEUE_ENABLED: "true"
      CORPUS_AUDITOR_QUEUE_URL: ${CORPUS_AUDITOR_QUEUE_URL:?CORPUS_AUDITOR_QUEUE_URL is required}
      CORPUS_AUDITOR_COMMAND_STREAM: ${CORPUS_AUDITOR_COMMAND_STREAM:-corpus:audit:commands:v1}
      CORPUS_AUDITOR_COMMAND_GROUP: ${CORPUS_AUDITOR_COMMAND_GROUP:-corpus-auditor-v1}
      CORPUS_AUDITOR_RESULT_STREAM: ${CORPUS_AUDITOR_RESULT_STREAM:-corpus:audit:results:v1}
    volumes:
      - ${DATA_ROOT_HOST_PATH:?DATA_ROOT_HOST_PATH is required}:/app/data
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  audit-result-projector:
    build:
      context: ./backend
    command: python manage.py project_audit_results --loop --interval ${AUDIT_RESULT_PROJECT_INTERVAL_SECONDS:-1}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      CORPUS_AUDITOR_QUEUE_ENABLED: "true"
      CORPUS_AUDITOR_QUEUE_URL: ${CORPUS_AUDITOR_QUEUE_URL:?CORPUS_AUDITOR_QUEUE_URL is required}
      CORPUS_AUDITOR_COMMAND_STREAM: ${CORPUS_AUDITOR_COMMAND_STREAM:-corpus:audit:commands:v1}
      CORPUS_AUDITOR_COMMAND_GROUP: ${CORPUS_AUDITOR_COMMAND_GROUP:-corpus-auditor-v1}
      CORPUS_AUDITOR_RESULT_STREAM: ${CORPUS_AUDITOR_RESULT_STREAM:-corpus:audit:results:v1}
      UPLOAD_SCANNER_BACKEND: ${UPLOAD_SCANNER_BACKEND:?UPLOAD_SCANNER_BACKEND is required}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:?METRICS_BEARER_TOKEN is required}
    volumes:
      - ${DATA_ROOT_HOST_PATH:?DATA_ROOT_HOST_PATH is required}:/app/data
    restart: unless-stopped

  outbox:
    build:
      context: ./backend
    command: python manage.py publish_outbox --loop --interval ${OUTBOX_PUBLISH_INTERVAL_SECONDS:-5} --cleanup-interval ${OUTBOX_CLEANUP_INTERVAL_SECONDS:-3600}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?CELERY_BROKER_URL is required}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:?CELERY_RESULT_BACKEND is required}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:?METRICS_BEARER_TOKEN is required}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-12}
      CELERY_VISIBILITY_TIMEOUT_SECONDS: ${CELERY_VISIBILITY_TIMEOUT_SECONDS:-3600}
      OUTBOX_LEASE_SECONDS: ${OUTBOX_LEASE_SECONDS:-30}
      OUTBOX_RETRY_INITIAL_SECONDS: ${OUTBOX_RETRY_INITIAL_SECONDS:-5}
      OUTBOX_RETRY_MAX_SECONDS: ${OUTBOX_RETRY_MAX_SECONDS:-300}
      OUTBOX_PUBLISHED_RETENTION_DAYS: ${OUTBOX_PUBLISHED_RETENTION_DAYS:-7}
      AGENT_APPROVAL_CLEANUP_BATCH_SIZE: ${AGENT_APPROVAL_CLEANUP_BATCH_SIZE:-100}
      AGENT_EXTERNAL_WAIT_TTL_SECONDS: ${AGENT_EXTERNAL_WAIT_TTL_SECONDS:-3600}
      AGENT_EXTERNAL_WAIT_CLEANUP_BATCH_SIZE: ${AGENT_EXTERNAL_WAIT_CLEANUP_BATCH_SIZE:-100}
      CORPUS_AUDITOR_QUEUE_ENABLED: "true"
      CORPUS_AUDITOR_QUEUE_URL: ${CORPUS_AUDITOR_QUEUE_URL:?CORPUS_AUDITOR_QUEUE_URL is required}
      CORPUS_AUDITOR_COMMAND_STREAM: ${CORPUS_AUDITOR_COMMAND_STREAM:-corpus:audit:commands:v1}
      CORPUS_AUDITOR_COMMAND_GROUP: ${CORPUS_AUDITOR_COMMAND_GROUP:-corpus-auditor-v1}
      CORPUS_AUDITOR_RESULT_STREAM: ${CORPUS_AUDITOR_RESULT_STREAM:-corpus:audit:results:v1}
      DATA_ROOT: ${DATA_ROOT:-/app/data}
      UPLOAD_SCANNER_BACKEND: ${UPLOAD_SCANNER_BACKEND:?UPLOAD_SCANNER_BACKEND is required}
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/srv/static:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.6.0
    profiles: [monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ${METRICS_BEARER_TOKEN_FILE:?METRICS_BEARER_TOKEN_FILE is required}:/etc/prometheus/secrets/metrics_bearer_token:ro
      - prometheus_data:/prometheus
    depends_on:
      web:
        condition: service_healthy
    expose:
      - "9090"
    restart: unless-stopped

volumes:
  static_files:
  prometheus_data:
  auditor_state:
